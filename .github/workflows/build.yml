name: Athlete Club · compilar APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      # Las claves son opcionales: sin secretos la app compila igual
      # (mapas OSM de desarrollo; cuenta y Club como «no configurado»).
      - name: Crear local.properties
        env:
          MAP_TILE_URL: ${{ secrets.MAP_TILE_URL }}
          MAP_ATTRIBUTION: ${{ secrets.MAP_ATTRIBUTION }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "MAP_TILE_URL=$MAP_TILE_URL"
            echo "MAP_ATTRIBUTION=$MAP_ATTRIBUTION"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_APP_ID=$FIREBASE_APP_ID"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
          } > local.properties

      # Firma estable: sin esto, cada ejecución crea una clave de depuración nueva y el APK
      # NO se instala encima de la versión anterior (Android exige la misma firma para actualizar
      # sin perder datos). Guarda tu debug.keystore en base64 en el secreto DEBUG_KEYSTORE_BASE64:
      #   base64 -w0 ~/.android/debug.keystore   (Windows: certutil -encode ...)
      - name: Restaurar clave de firma de depuración
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Clave de depuración restaurada: el APK podrá actualizar la app instalada."
          else
            echo "::warning::Sin DEBUG_KEYSTORE_BASE64: el APK usará una clave nueva y no se instalará encima de la versión actual."
          fi

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Tests (métricas, deportes y reglas)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/AthleteClub-${VERSION}-debug.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: athlete-club-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Subir informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
